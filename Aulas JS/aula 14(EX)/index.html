<!DOCTYPE html>

    <title>Contador de Numeros</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

            <p>
                <button onclick="verificar()">Verificar</button>

        </div>
        <div id="res">
            Preparando a contagem
        </div>
    </section>
